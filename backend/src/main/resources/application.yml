spring:
  application:
    name: vaultdesk-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vaultdesk}
    username: ${SPRING_DATASOURCE_USERNAME:vaultdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:vaultdesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      service: vaultdesk-backend

vaultdesk:
  crypto:
    master-key-base64: ${VAULTDESK_MASTER_KEY:}
  jwt:
    secret: ${VAULTDESK_JWT_SECRET:}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
